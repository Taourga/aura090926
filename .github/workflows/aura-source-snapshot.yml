name: AURA Source Snapshot

on:
  push:
    branches:
      - aurademo
    paths:
      - .github/workflows/aura-source-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshot
          git archive --format=zip --output="snapshot/AURA_SOURCE_${GITHUB_SHA}.zip" HEAD
          printf '%s\n' "$GITHUB_SHA" > snapshot/COMMIT.txt

      - name: Fetch encrypted Supabase snapshots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "https://yksbenmcqlchnvwyeody.supabase.co/functions/v1/aura-backup-export?id=public_data" --output snapshot/public_data_snapshot.pgp
          curl --fail --silent --show-error --location "https://yksbenmcqlchnvwyeody.supabase.co/functions/v1/aura-backup-export?id=auth_manifest" --output snapshot/auth_users_manifest.pgp

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum snapshot/AURA_SOURCE_*.zip snapshot/public_data_snapshot.pgp snapshot/auth_users_manifest.pgp > snapshot/SHA256SUMS.txt

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-full-snapshot
          path: snapshot/
          if-no-files-found: error
          retention-days: 30
