name: AURA Mobile MVP

on:
  push:
    branches:
      - mobile-mvp-20260918
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-mvp.yml"
  pull_request:
    branches: [master]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-mvp.yml"

permissions:
  contents: write

jobs:
  mobile-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck mobile
        run: npm run typecheck

      - name: Bundle iOS
        run: npx expo export --platform ios --output-dir dist-ios

      - name: Bundle Android
        run: npx expo export --platform android --output-dir dist-android

      - name: Commit generated lockfile
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "mobile: lock Expo dependencies"
            git push origin HEAD:mobile-mvp-20260918
          fi
